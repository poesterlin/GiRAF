services:
  editor:
    build: .
    ports: !reset []
    expose:
      - '3000'
    restart: unless-stopped
    init: true
    environment:
      ORIGIN: https://${HOST_DOMAIN}
      CLUT_DIR: /app/cluts
      IMPORT_DIR: /app/import
      EXPORT_DIR: /app/export
      TMP_DIR: /app/tmp
    env_file: .env
    networks:
      - default
      - traefik_web
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_web
      - traefik.http.routers.raw-editor.rule=Host(`${HOST_DOMAIN}`)
      - traefik.http.services.raw-editor.loadbalancer.server.port=3000
      - traefik.http.routers.raw-editor.middlewares=raw-editor-compress
      - traefik.http.middlewares.raw-editor-compress.compress=true
      - traefik.http.middlewares.raw-editor-compress.compress.excludedcontenttypes=image/jpeg,image/png,image/webp,image/avif,image/tiff,application/zip,application/octet-stream,text/event-stream
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      # Check every second while starting, so `up --wait` returns as soon as the app answers
      start_interval: 1s
    volumes:
      - ./cluts:/app/cluts
      - import:/app/import
      - ./export:/app/export
      - ./tmp:/app/tmp

networks:
  traefik_web:
    external: true

volumes:
  import:
    driver: local
    driver_opts:
      type: none
      device: ./import
      o: bind
