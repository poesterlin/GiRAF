# volumes:
#   pgdata:

  editor:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        RAWTHERAPEE_VERSION: ${RAWTHERAPEE_VERSION}
    env_file: 
     - .env
    ports:
      - 3000:3000
    environment:
      - CLUT_DIR=/app/cluts
      - IMPORT_DIR=/app/import
      - EXPORT_DIR=/app/export
      - TMP_DIR=/app/tmp
    volumes:
      - ./cluts:/app/cluts
      - import:/app/import
      - ./export:/app/export
      - ./tmp:/app/tmp

  # Copies new files from an SD card into the import folder and starts an import.
  # Opt in with: docker compose --profile sd-card up -d
  watchers:
    profiles: [sd-card]
    image: oven/bun:debian
    working_dir: /app
    command: bun scripts/sd-card-importer.ts
    restart: unless-stopped
    depends_on:
      - editor
    environment:
      - IMPORT_DIR=/app/import
      - EDITOR_API_URL=http://editor:3000/api/imports/run-import
    volumes:
      - ./src/scripts:/app/scripts:ro
      - import:/app/import
      # rslave lets a card mounted after start-up appear inside the container.
      - type: bind
        source: ${SD_CARD_IMPORT_PATH:-/mnt/sdcard}
        target: /app/sd-card-import
        read_only: true
        bind:
          propagation: rslave

volumes:
  import:
    driver: local
    driver_opts:
      type: none
      device: ./import
      o: bind
